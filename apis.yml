name: taptrip.co
description: >-
  TapTrip (taptrip.co) was a UK-based self-serve business travel and expense
  booking platform for SMEs, founded in 2018 in Manchester and part of the
  Barclays Accelerator powered by Techstars. It let smaller businesses book and
  manage flights, hotels, rail, and ground transportation without a travel
  management company. TapTrip was acquired by TripStax in July 2022 and folded
  into the TripStax platform as an SME online-booking module for travel
  management companies; the standalone brand was absorbed. As of this
  enrichment pass the taptrip.co domain no longer hosts an active product — it
  resolves to a ParkingCrew domain-parking service and the TLS endpoint does not
  respond. No public API, developer portal, documentation, SDKs, or
  /.well-known discovery surface was found for the standalone company.
